name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    name: API (type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lingtour_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit --skipLibCheck --project tsconfig.build.json
      - run: npm test -- --runInBand
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: lingtour_test
          DB_USER: test
          DB_PASSWORD: test
          JWT_SECRET: ci-test-secret
      - run: npm run build

  site:
    name: Site (type-check + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx next typegen
      - run: npx tsc --noEmit --skipLibCheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  admin:
    name: Admin (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docs:
    name: Docs (workflow lint + whitespace + local links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workflow syntax with actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tools_dir"
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz \
            --pattern actionlint_1.7.12_checksums.txt --dir "$tools_dir"
          (
            cd "$tools_dir"
            grep ' actionlint_1.7.12_linux_amd64.tar.gz$' actionlint_1.7.12_checksums.txt | sha256sum --check -
            tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          )
          "$tools_dir/actionlint" .github/workflows/ci.yml .github/workflows/deploy.yml
      - name: Check workflow formatting
        run: npx --yes prettier@3.9.10 --check .github/workflows/ci.yml .github/workflows/deploy.yml
      - name: Check commit whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base_sha="$BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = 0000000000000000000000000000000000000000 ]; then
            base_sha=$(git rev-parse "$HEAD_SHA^" 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          git diff --check "$base_sha" "$HEAD_SHA"
      - name: Test Markdown checker
        run: python -m unittest discover -s tools/tests -p 'test_check_docs.py' -v
      - name: Check local Markdown links
        run: python tools/check-docs.py

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [api, site, admin, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t lingtour-api:${{ github.sha }} ./api
      - name: Build Site image
        run: docker build -f site/Dockerfile -t lingtour-site:${{ github.sha }} .
      - name: Build Admin image
        run: docker build -f admin-frontend/Dockerfile -t lingtour-admin:${{ github.sha }} .
